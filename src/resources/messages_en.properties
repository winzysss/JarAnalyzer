wjf.btn.scanMemory=Scan Running Java
wjf.btn.scanMemory.tip=Examines the JARs running Java processes actually loaded. This is what catches a cheat that was deleted from disk but is still loaded.
wjf.mem.scanning=Examining running JVMs
wjf.mem.none=No running Java process found (is the game open?).
wjf.mem.unavailable=The Attach API is not present in this runtime; the memory scan is unavailable.
wjf.h.ghost=Running but gone from disk
wjf.h.ghost.why=This JAR is loaded into a running Java process, but its file no longer exists on disk. It was deleted after being loaded — a disk scan can never find it.

