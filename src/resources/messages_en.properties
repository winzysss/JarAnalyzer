# --- heuristic findings ---
wjf.h.classes=%d / %d classes
wjf.h.bytes=%d bytes

wjf.h.encrypted=Archive contains password-protected entries
wjf.h.encrypted.loc=%d entry(s)
wjf.h.encrypted.why=Encrypted entries cannot be decompiled or inspected. A JAR that encrypts its own contents is hiding them from exactly this kind of check.

wjf.h.duplicate=Duplicate entry names in archive
wjf.h.duplicate.loc=%d name(s)
wjf.h.duplicate.why=Two entries share a path (e.g. %s). Decompilers and the JVM can pick different copies, which is a known way to hide code from static analysis.

wjf.h.traversal=Path traversal in entry name
wjf.h.traversal.why=An entry escapes the extraction root; on extraction this writes outside the target directory (Zip Slip).

wjf.h.method=Non-standard compression method
wjf.h.method.why=JARs use stored or deflate. Other methods are not readable by the standard toolchain and often indicate AES-encrypted entries.

wjf.h.prefix=Data prepended before the archive
wjf.h.prefix.why=Bytes sit in front of the first ZIP header. This is normal for self-extracting executables and abnormal for a mod JAR.

wjf.h.trailing=Data appended after the archive
wjf.h.trailing.why=Bytes follow the end-of-central-directory record; a common place to stash a payload the ZIP tooling will never list.

wjf.h.nonascii=Non-ASCII characters in entry names
wjf.h.nonascii.why=Unicode look-alikes and zero-width characters in class names are a standard obfuscation trick to defeat name-based searching.

wjf.h.anomaly=Archive anomaly
wjf.h.unreadable=Archive structure unreadable
wjf.h.unreadable.why=The ZIP directory could not be parsed, so the contents cannot be enumerated.

wjf.h.fail.tooSmall=file too small to be a ZIP (%d bytes)
wjf.h.fail.noEocd=no end-of-central-directory record
wjf.h.fail.cdRange=central directory points outside the file
wjf.h.anom.cdRange=Central directory offset/size out of range (offset=%d, size=%d, file=%d)
wjf.h.anom.pastEnd=Entry points past end of file: %s
wjf.h.anom.ratio=Extreme compression ratio (%d:1): %s
wjf.h.anom.count=Central directory declares %d entries but %d were parseable

wjf.h.badclass=Classes with an unreadable structure
wjf.h.badclass.why=The constant pool of these classes could not be parsed. That structure is simple and fixed, so a class that breaks it is malformed on purpose.

wjf.h.obf=Obfuscated
wjf.h.obf.named=Obfuscated (%s)
wjf.h.obf.score=score %.2f over %d classes
wjf.h.obf.shortNames=%d one/two-character class names
wjf.h.obf.decrypt=%d string-decrypt signatures
wjf.h.obf.barcode=%d barcode names

wjf.obf.kind.unicode=Unicode-identifier obfuscator
wjf.obf.kind.barcode=Barcode-name obfuscator
wjf.obf.kind.strenc=String-encrypting obfuscator
wjf.obf.kind.proguard=ProGuard-class (name minification only)
wjf.obf.kind.generic=Generic

wjf.h.invisible=Zero-width characters in identifiers
wjf.h.invisible.loc=%d identifier(s)
wjf.h.invisible.why=Identifiers contain characters that render as nothing, so two different classes look like the same name on screen. There is no legitimate build step that produces this.

wjf.h.strenc=String constants are encrypted at rest
wjf.h.strenc.loc=%d signatures
wjf.h.strenc.why=Literals are decrypted at runtime, so a plain text search of the archive cannot see what the code actually references.

wjf.h.marker=Obfuscator signature: %s
wjf.h.marker.why=Marker string left by %s.


wjf.h.incomplete=Analysis incomplete — not all classes were read
wjf.h.incomplete.why=A time or size limit stopped the run before these classes were examined, so a clean result here does not cover the whole archive. Raise the per-JAR timeout or the class cap in Settings to finish it.

wjf.h.native=Native library inside archive
wjf.h.native.why=A JAR carrying a native binary can execute code outside the JVM's reach, where bytecode analysis cannot follow.

wjf.h.script=Executable/script resource in archive
wjf.h.script.why=Mod JARs do not normally ship runnable scripts.

wjf.h.entropy=High-entropy opaque resource
wjf.h.entropy.why=%.2f bits/byte over %s — could be an encrypted payload, or simply already-compressed data.

wjf.h.agent=Declares a Java agent
wjf.h.agent.why=Premain/Agent-Class lets this JAR rewrite the bytecode of any class the JVM loads.
wjf.h.tweak=Declares a LaunchWrapper tweaker
wjf.h.tweak.why=TweakClass runs before the game starts and can patch it. Used by legitimate mod loaders and by cheat injectors alike.
wjf.h.coremod=Declares an FML core plugin
wjf.h.coremod.why=Core mods load before the game and can transform any class.

wjf.h.nestedSkip=Nested JAR not opened (depth limit)
wjf.h.nestedSkip.why=Increase the nesting depth in Settings to analyse this.
wjf.h.nestedFail=Nested JAR could not be read
wjf.h.sig=JAR signature verification failed

wjf.h.note.notZip=Not a ZIP container: %s
wjf.h.note.openFail=Archive could not be opened: %s
wjf.h.note.aborted=Analysis aborted: %s
wjf.h.note.deadline=Inventory stopped at the per-JAR deadline.
wjf.h.note.nested=Nested JAR %s -> %s

