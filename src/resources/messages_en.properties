# --- disguised archives / recycle bin ---
wjf.disc.probing=Looking for disguised archives  %,d / %,d
wjf.h.disguised=Java archive with a disguised extension
wjf.h.disguised.why=This file is a valid Java archive but is not named like one. Saving a JAR under another extension is not something anyone does by accident; it is the cheapest way to hide from a scanner that only reads file names.
wjf.h.recycled=From the recycle bin
wjf.h.recycled.why=The file was deleted but its contents are intact. Being deleted does not make it innocent — usually the opposite.

