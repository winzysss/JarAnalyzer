# --- heuristik bulgular ---
wjf.h.classes=%d / %d sınıf
wjf.h.bytes=%d bayt

wjf.h.encrypted=Arşiv parola korumalı girdiler içeriyor
wjf.h.encrypted.loc=%d girdi
wjf.h.encrypted.why=Şifreli girdiler ne decompile edilebilir ne de incelenebilir. Kendi içeriğini şifreleyen bir JAR, onu tam da bu tür bir denetimden saklıyor demektir.

wjf.h.duplicate=Arşivde aynı isimde birden fazla girdi
wjf.h.duplicate.loc=%d isim
wjf.h.duplicate.why=İki girdi aynı yolu paylaşıyor (örn. %s). Decompiler ile JVM farklı kopyaları seçebilir; bu, kodu statik analizden saklamanın bilinen bir yoludur.

wjf.h.traversal=Girdi adında dizin dışına çıkma
wjf.h.traversal.why=Bir girdi çıkarma kökünün dışına taşıyor; açıldığında hedef klasörün dışına yazar (Zip Slip).

wjf.h.method=Standart dışı sıkıştırma yöntemi
wjf.h.method.why=JAR'lar ya sıkıştırmasız ya da deflate kullanır. Diğer yöntemler standart araçlarla okunamaz ve genellikle AES ile şifrelenmiş girdilere işaret eder.

wjf.h.prefix=Arşivin önüne veri eklenmiş
wjf.h.prefix.why=İlk ZIP başlığından önce baytlar var. Kendi kendine açılan çalıştırılabilir dosyalarda normaldir, bir mod JAR'ında değildir.

wjf.h.trailing=Arşivin sonuna veri eklenmiş
wjf.h.trailing.why=Merkezi dizin kaydından sonra baytlar geliyor; ZIP araçlarının hiçbir zaman listelemeyeceği bir yük saklamak için sık kullanılan yer.

wjf.h.nonascii=Girdi adlarında ASCII dışı karakterler
wjf.h.nonascii.why=Sınıf adlarındaki Unicode benzerleri ve görünmez karakterler, isme dayalı aramayı boşa çıkarmak için kullanılan standart bir obfuscation hilesidir.

wjf.h.anomaly=Arşiv anomalisi
wjf.h.unreadable=Arşiv yapısı okunamadı
wjf.h.unreadable.why=ZIP dizini ayrıştırılamadı, bu yüzden içerik listelenemiyor.

wjf.h.fail.tooSmall=ZIP olamayacak kadar küçük (%d bayt)
wjf.h.fail.noEocd=merkezi dizin sonu kaydı yok
wjf.h.fail.cdRange=merkezi dizin dosyanın dışını gösteriyor
wjf.h.anom.cdRange=Merkezi dizin konumu/boyutu aralık dışı (konum=%d, boyut=%d, dosya=%d)
wjf.h.anom.pastEnd=Girdi dosya sonunun ötesini gösteriyor: %s
wjf.h.anom.ratio=Aşırı sıkıştırma oranı (%d:1): %s
wjf.h.anom.count=Merkezi dizin %d girdi bildiriyor ama %d tanesi ayrıştırılabildi

wjf.h.badclass=Yapısı okunamayan sınıflar
wjf.h.badclass.why=Bu sınıfların constant pool'u ayrıştırılamadı. O yapı basit ve sabittir; onu bozan bir sınıf kasıtlı olarak bozulmuştur.

wjf.h.obf=Obfuscate edilmiş
wjf.h.obf.named=Obfuscate edilmiş (%s)
wjf.h.obf.score=%d sınıf üzerinden skor %.2f
wjf.h.obf.shortNames=%d adet bir/iki karakterlik sınıf adı
wjf.h.obf.decrypt=%d string çözme imzası
wjf.h.obf.barcode=%d adet barkod tipi isim

wjf.obf.kind.unicode=Unicode karakterli obfuscator
wjf.obf.kind.barcode=Barkod isimli obfuscator
wjf.obf.kind.strenc=String şifreleyen obfuscator
wjf.obf.kind.proguard=ProGuard tipi (yalnızca isim kısaltma)
wjf.obf.kind.generic=Genel

wjf.h.invisible=Tanımlayıcılarda görünmez karakterler
wjf.h.invisible.loc=%d tanımlayıcı
wjf.h.invisible.why=Tanımlayıcılar hiçbir şey çizmeyen karakterler içeriyor, yani iki farklı sınıf ekranda aynı isimde görünüyor. Bunu üreten meşru bir derleme adımı yoktur.

wjf.h.strenc=String sabitleri şifreli saklanıyor
wjf.h.strenc.loc=%d imza
wjf.h.strenc.why=Metinler çalışma anında çözülüyor, bu yüzden arşivde düz metin araması kodun gerçekte neye başvurduğunu göremez.

wjf.h.marker=Obfuscator imzası: %s
wjf.h.marker.why=%s tarafından bırakılmış imza metni.


wjf.h.incomplete=Analiz tamamlanmadı — tüm sınıflar okunmadı
wjf.h.incomplete.why=Bir süre veya boyut sınırı, bu sınıflar incelenmeden çalışmayı durdurdu; yani buradaki temiz sonuç arşivin tamamını kapsamıyor. Bitirmek için Ayarlar'dan JAR başına zaman sınırını veya sınıf sınırını yükseltin.

wjf.h.native=Arşivin içinde native kütüphane
wjf.h.native.why=Native ikili taşıyan bir JAR, kodu JVM'in erişemediği yerde çalıştırabilir; bytecode analizi oraya kadar takip edemez.

wjf.h.script=Arşivde çalıştırılabilir dosya veya betik
wjf.h.script.why=Mod JAR'ları normalde çalıştırılabilir betik taşımaz.

wjf.h.entropy=Yüksek entropili, içeriği okunamayan kaynak
wjf.h.entropy.why=%s boyunca %.2f bit/bayt — şifreli bir yük olabilir, ya da yalnızca hâlihazırda sıkıştırılmış veri.

wjf.h.agent=Java agent tanımlıyor
wjf.h.agent.why=Premain/Agent-Class, bu JAR'ın JVM'in yüklediği herhangi bir sınıfın bytecode'unu yeniden yazmasına izin verir.
wjf.h.tweak=LaunchWrapper tweaker tanımlıyor
wjf.h.tweak.why=TweakClass oyun başlamadan önce çalışır ve oyunu yamalayabilir. Hem meşru mod yükleyiciler hem de hile enjektörleri kullanır.
wjf.h.coremod=FML core plugin tanımlıyor
wjf.h.coremod.why=Core modlar oyundan önce yüklenir ve herhangi bir sınıfı dönüştürebilir.

wjf.h.nestedSkip=İç içe JAR açılmadı (derinlik sınırı)
wjf.h.nestedSkip.why=Bunu analiz etmek için Ayarlar'dan iç içe JAR derinliğini artırın.
wjf.h.nestedFail=İç içe JAR okunamadı
wjf.h.sig=JAR imza doğrulaması başarısız

