wjf.h.disguised.why=Bu dosya geçerli bir Java arşivi ama adı öyle görünmüyor. Bir jar'ı başka uzantıyla kaydetmek kimsenin kazara yaptığı bir şey değil; sadece dosya adına bakan tarayıcılardan saklanmanın en ucuz yoludur.
