wjf.btn.scanMemory=Çalışan Java'yı Tara
wjf.btn.scanMemory.tip=Çalışan Java süreçlerinin gerçekten yüklediği JAR'ları inceler. Diskten silinmiş ama hâlâ yüklü olan bir hileyi bu yakalar.
wjf.mem.scanning=Çalışan JVM'ler inceleniyor
wjf.mem.none=Çalışan bir Java süreci bulunamadı (oyun açık mı?).
wjf.mem.unavailable=Bu çalışma zamanında Attach API yok, bellek taraması kullanılamıyor.
wjf.h.ghost=Çalışıyor ama diskte yok
wjf.h.ghost.why=Bu JAR çalışan bir Java sürecine yüklü, fakat dosyası diskte artık yok. Yüklendikten sonra silinmiş demektir — disk taraması bunu asla bulamaz.

